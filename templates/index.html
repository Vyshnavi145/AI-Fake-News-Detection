<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Verifier</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            🛡️ AI News Verifier
        </div>

        <ul class="nav-links">
            <li><a href="/">🏠 Home</a></li>
            <li><a href="/history">🕒 History</a></li>
            <li><a href="/statistics">📊 Statistics</a></li>
            <li><a href="/about">ℹ️ About</a></li>
        </ul>
    </nav>

    <div class="main-container">

        <!-- Left Side -->
        <div class="input-card">

            <h2>📰 Enter News or Article</h2>

            <form method="POST">

                <textarea
                    name="news"
                    placeholder="Paste any claim, statement, or news article here..."
                    required></textarea>

                <button type="submit">
                    Verify News
                </button>

            </form>

        </div>

        <!-- Right Side -->
        <div class="result-card">

            <h2>✅ Verification Result</h2>

            {% if prediction %}

            <div class="result-box">
                <pre>{{ prediction }}</pre>
            </div>

            {% else %}

            <div class="empty-result">
                Enter an article and click Verify News.
            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
