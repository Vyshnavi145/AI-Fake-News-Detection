<!DOCTYPE html>
<html>

<head>
    <title>AI Fake News Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>AI Fake News Detection System</h1>

    <form method="POST">

        <textarea
            name="news"
            rows="10"
            placeholder="Paste your news here..."
            required>
        </textarea>

        <br><br>

        <button type="submit">
            Check News
        </button>

    </form>

    <div class="result">
        {{ prediction }}
    </div>

</div>

</body>
</html>
